# electron-builder.yml — Balloo Desktop build configuration
# Targets: Windows (exe, msi, portable), Linux (deb, rpm, AppImage, tar.gz), macOS (dmg, zip)

appId: su.balloo.desktop
productName: Balloo
copyright: Copyright © 2026 Balloo
directories:
  output: release
  buildResources: assets
files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - assets/**/*

# Windows
win:
  target:
    - target: nsis
      arch: [x64, ia32]
    - target: msi
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: assets/icon.png
  artifactName: "${productName} ${version} Setup ${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico

portable:
  artifactName: "${productName} ${version} Portable ${arch}.${ext}"

msi:
  artifactName: "${productName} ${version} ${arch}.${ext}"

# Linux
linux:
  executableName: balloo
  target:
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64]
    - target: AppImage
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
  icon: assets/icon.png
  category: Network
  synopsis: Balloo Messenger
  description: "Balloo — Российский мессенджер для общения, работы и бизнеса"
  artifactName: "balloo_${version}_${arch}.${ext}"
  maintainer: team@balloo.su

# macOS
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: assets/icon.icns
  category: public.app-category.social-networking
  artifactName: "Balloo ${version} ${arch}.${ext}"
  darkModeSupport: true

dmg:
  title: "Balloo ${version}"
  background: assets/background.png
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Code signing (disabled for now, will be set up in v2+)
# win:
#   certificateFile: ...
#   certificatePassword: ...
# mac:
#   identity: ...

# Publish (auto-updater)
publish:
  provider: generic
  url: https://download.balloo.su/desktop/updates
  channel: latest