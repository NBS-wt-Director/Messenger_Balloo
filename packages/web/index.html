<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Balloo — Российский мессенджер для общения, работы и бизнеса" />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="icon" type="image/png" href="/assets/logos/product-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Balloo — Мессенджер</title>
    <script>
      // Функциональные cookie (тема/язык) применяются ДО первого рендера.
      // Читаются напрямую из document.cookie (cookie с доменом .balloo.su доступны всем поддоменам).
      (function () {
        function getCookie(name) {
          var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
          return m ? decodeURIComponent(m[1]) : null;
        }
        var theme = getCookie('balloo-theme');
        if (theme === 'dark' || theme === 'light' || theme === 'russian') {
          document.documentElement.setAttribute('data-theme', theme);
        }
        var lang = getCookie('balloo-language');
        if (lang && /^[a-z]{2,3}$/.test(lang)) {
          document.documentElement.setAttribute('lang', lang);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
