<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>Balloo — Нет подключения</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .offline-container {
      text-align: center;
      max-width: 400px;
    }
    
    .offline-icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.6;
    }
    
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ffffff;
    }
    
    p {
      font-size: 16px;
      line-height: 1.5;
      color: #a0a0b0;
      margin-bottom: 24px;
    }
    
    .retry-btn {
      display: inline-block;
      padding: 12px 32px;
      background: #2db84d;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .retry-btn:hover {
      background: #35d158;
    }
    
    .status {
      margin-top: 16px;
      font-size: 14px;
      color: #a0a0b0;
    }
    
    .status.connected {
      color: #2db84d;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>Нет подключения к интернету</h1>
    <p>Проверьте ваше интернет-соединение и попробуйте снова. Вы можете просмотреть кэшированные данные без подключения.</p>
    <button class="retry-btn" onclick="window.location.reload()">Переподключиться</button>
    <div class="status" id="status"></div>
  </div>
  
  <script>
    const statusEl = document.getElementById('status');
    
    // Автоматическая попытка переподключения при восстановлении сети
    window.addEventListener('online', () => {
      statusEl.textContent = 'Подключение восстановлено!';
      statusEl.classList.add('connected');
      setTimeout(() => window.location.reload(), 1500);
    });
    
    // Показываем текущий статус
    if (navigator.onLine) {
      statusEl.textContent = 'Проверяем подключение...';
      setTimeout(() => window.location.reload(), 500);
    } else {
      statusEl.textContent = 'Ожидание подключения...';
    }
  </script>
</body>
</html>
