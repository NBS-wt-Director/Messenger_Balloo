name: CD — Deploy to Production

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22'
  PNPM_VERSION: 'latest'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Build & Push Docker images ───
  docker-release:
    name: Build & Push Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Server image ───
      - name: Extract server metadata
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server
          tags: |
            type=semver,pattern={{version}},prefix=server-
            type=semver,pattern={{major}}.{{minor}},prefix=server-
            type=semver,pattern={{major}},prefix=server-
            type=sha,prefix=server-,format=short

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            VERSION=${{ github.ref_name }}

      # ─── Web image ───
      - name: Extract web metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web
          tags: |
            type=semver,pattern={{version}},prefix=web-
            type=semver,pattern={{major}}.{{minor}},prefix=web-
            type=semver,pattern={{major}},prefix=web-
            type=sha,prefix=web-,format=short

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Create GitHub Release ───
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: docker-release
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"* %s (%h) by %an on %ad" --date=short)
          else
            CHANGELOG=$(git log --pretty=format:"* %s (%h) by %an on %ad" --date=short $PREVIOUS_TAG..HEAD)
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Balloo ${{ github.ref_name }}"
          body: |
            ## 🚀 Balloo ${{ github.ref_name }}
            
            ### Что нового
            ${{ steps.changelog.outputs.changelog }}
            
            ### Docker images
            - Server: `ghcr.io/${{ github.repository }}/server:server-${{ github.ref_name }}`
            - Web: `ghcr.io/${{ github.repository }}/web:web-${{ github.ref_name }}`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Deploy to Production ───
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-release, create-release]
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/balloo
            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: Health check production
        run: |
          echo "Waiting for production health check..."
          for i in {1..30}; do
            if curl -sf https://balloo.su/health > /dev/null; then
              echo "✅ Production is healthy"
              exit 0
            fi
            echo "Attempt $i/30 failed, retrying in 10s..."
            sleep 10
          done
          echo "❌ Production health check failed"
          exit 1

      - name: Notify team
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: releases
          SLACK_USERNAME: Balloo CI
          SLACK_ICON: https://balloo.su/logo.png
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "Release ${{ github.ref_name }}"
          SLACK_MESSAGE: |
            Balloo ${{ github.ref_name }} deployed to production
            Status: ${{ job.status == 'success' && '✅ Deployed' || '❌ Failed' }}
            Commit: ${{ github.sha }}
