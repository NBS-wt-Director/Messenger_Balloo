name: CI — Test, Lint & Build

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: 'latest'

jobs:
  ci:
    name: Test, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: balloo
          POSTGRES_PASSWORD: balloo123
          POSTGRES_DB: balloo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: |
          cd packages/shared
          npx prisma generate

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://balloo:balloo123@localhost:5432/balloo
        run: |
          cd packages/shared
          npx prisma db push --accept-data-loss

      - name: Seed database
        env:
          DATABASE_URL: postgresql://balloo:balloo123@localhost:5432/balloo
        run: |
          cd packages/shared
          npx prisma db seed

      - name: TypeScript check (server)
        run: cd packages/server && npx tsc --noEmit

      - name: TypeScript check (web)
        run: cd packages/web && npx tsc --noEmit

      - name: TypeScript check (desktop)
        run: cd packages/desktop && npx tsc --noEmit || true

      - name: Lint (shared)
        run: pnpm lint:shared || true

      - name: Lint (server)
        run: pnpm lint:server || true

      - name: Lint (web)
        run: pnpm lint:web || true

      - name: Test shared
        run: pnpm test:shared

      - name: Test server
        env:
          DATABASE_URL: postgresql://balloo:balloo123@localhost:5432/balloo
          REDIS_URL: redis://localhost:6379
        run: pnpm test:server

      - name: Test web
        run: pnpm test:web

      - name: Build shared
        run: pnpm build:shared

      - name: Build server
        run: pnpm build:server

      - name: Build web
        run: pnpm build:web
