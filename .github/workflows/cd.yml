name: CD — Docker Release & Deploy

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22'
  PNPM_VERSION: 'latest'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Docker Build & Push ───
  docker-release:
    name: Docker Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/server
          tags: |
            type=semver,pattern={{version}},prefix=server-
            type=semver,pattern={{major}}.{{minor}},prefix=server-
            type=semver,pattern={{major}},prefix=server-
            type=sha,prefix=server-,format=short
            type=raw,value=latest,prefix=server-

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Extract metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web
          tags: |
            type=semver,pattern={{version}},prefix=web-
            type=semver,pattern={{major}}.{{minor}},prefix=web-
            type=semver,pattern={{major}},prefix=web-
            type=sha,prefix=web-,format=short
            type=raw,value=latest,prefix=web-

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── GitHub Release ───
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: docker-release
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Deploy to Production ───
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-release, create-release]
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/balloo
            docker compose -f docker/prod/docker-compose.prod.yml down
            docker compose -f docker/prod/docker-compose.prod.yml pull
            docker compose -f docker/prod/docker-compose.prod.yml run --rm server npx prisma migrate deploy
            docker compose -f docker/prod/docker-compose.prod.yml up -d
            docker image prune -f

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl -sf https://balloo.su/ > /dev/null; then
              echo "✅ Production is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1

      - name: Notify
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: releases
          SLACK_TITLE: "Release ${{ github.ref_name }}"
          SLACK_MESSAGE: "Status: ${{ job.status == 'success' && '✅ Deployed' || '❌ Failed' }}"
