<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: Features Mgmt — Управление фичами</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 640px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .features-mgmt__table { width: 100%; border-collapse: collapse; }
    .features-mgmt__table th { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-color); }
    .features-mgmt__table td { padding: 12px; font-size: 14px; color: var(--text-primary); border-bottom: 1px solid var(--border-color); }
    .features-mgmt__table__row:hover td { background: var(--bg-hover); }
    .features-mgmt__table__name { font-weight: 600; }
    .features-mgmt__table__status { font-size: 12px; padding: 3px 8px; font-weight: 600; }
    .features-mgmt__table__status--active { background: rgba(45,184,77,0.12); color: var(--accent); }
    .features-mgmt__table__status--draft { background: rgba(107,119,133,0.12); color: #6b7785; }
    .features-mgmt__table__status--archived { background: rgba(227,66,45,0.12); color: var(--danger); }
    .features-mgmt__table__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .features-mgmt__table__header__title { font-size: 16px; font-weight: 700; color: var(--text-primary); }
    .features-mgmt__table__actions { display: flex; gap: 8px; }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📦 Компонент: Features Mgmt (Управление фичами)</h1>

    <div class="demo-section">
      <div class="demo-label">Таблица фич</div>
      <div class="features-mgmt__table__header">
        <div class="features-mgmt__table__header__title">Фич-реквесты (12)</div>
        <button class="btn btn--primary btn--sm">+ Добавить</button>
      </div>
      <table class="features-mgmt__table">
        <thead><tr><th>Название</th><th>Статус</th><th>Голосов</th><th>Действия</th></tr></thead>
        <tbody>
          <tr class="features-mgmt__table__row">
            <td class="features-mgmt__table__name">Тёмная тема</td>
            <td><span class="features-mgmt__table__status features-mgmt__table__status--active">Активна</span></td>
            <td>1 247</td>
            <td><div class="features-mgmt__table__actions"><button class="bots-table__action-btn">Ред.</button></div></td>
          </tr>
          <tr class="features-mgmt__table__row">
            <td class="features-mgmt__table__name">Видеозвонки</td>
            <td><span class="features-mgmt__table__status features-mgmt__table__status--draft">Черновик</span></td>
            <td>834</td>
            <td><div class="features-mgmt__table__actions"><button class="bots-table__action-btn">Ред.</button></div></td>
          </tr>
          <tr class="features-mgmt__table__row">
            <td class="features-mgmt__table__name">Голосовые сообщения</td>
            <td><span class="features-mgmt__table__status features-mgmt__table__status--archived">Архив</span></td>
            <td>2 103</td>
            <td><div class="features-mgmt__table__actions"><button class="bots-table__action-btn">Ред.</button></div></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
