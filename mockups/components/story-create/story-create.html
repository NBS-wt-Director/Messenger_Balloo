<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: Story Create — Создание сторис</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 480px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .story-create {
      background: var(--bg-glass);
      backdrop-filter: blur(var(--blur));
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-glass);
      overflow: hidden;
    }
    .story-create__preview {
      height: 360px;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      color: var(--text-muted);
      position: relative;
    }
    .story-create__camera-btn {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      clip-path: var(--octagon-clip);
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }
    .story-create__camera-btn:hover { opacity: 0.85; }
    .story-create__tools {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 12px;
      border-top: 1px solid var(--border-color);
    }
    .story-create__tool-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); cursor: pointer;
      font-size: 16px;
    }
    .story-create__tool-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
    .story-create__footer {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📦 Компонент: Story Create (Создание сторис)</h1>

    <div class="demo-section">
      <div class="demo-label">Создание сторис</div>
      <div class="story-create">
        <div class="story-create__preview">
          📷
          <div class="story-create__camera-btn" title="Камера">📷</div>
        </div>
        <div class="story-create__tools">
          <div class="story-create__tool-btn" title="Текст">T</div>
          <div class="story-create__tool-btn" title="Рисунок">✏</div>
          <div class="story-create__tool-btn" title="Стикер">😊</div>
          <div class="story-create__tool-btn" title="Фильтр">🎨</div>
          <div class="story-create__tool-btn" title="Музыка">🎵</div>
        </div>
        <div class="story-create__footer">
          <button class="btn btn--secondary btn--sm">Черновик</button>
          <button class="btn btn--primary btn--sm">Опубликовать</button>
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
