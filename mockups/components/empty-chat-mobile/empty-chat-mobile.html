<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Компонент: Empty Chat Mobile — Пустой чат (mobile)</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    body { background: var(--bg-primary); }
    .mobile-frame {
      width: 375px;
      height: 812px;
      margin: 0 auto;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .mobile-frame .topbar { height: 48px; font-size: 16px; }
    .mobile-frame .topbar__title { font-size: 17px; }
    .component-demo { padding: 24px; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .empty-chat-mobile {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .empty-chat-mobile__animation {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      clip-path: var(--octagon-clip);
      background: var(--bg-glass);
      border: 1px solid var(--border-color);
    }
    .empty-chat-mobile__title { font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
    .empty-chat-mobile__subtitle { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 16px; }
    .empty-chat-mobile__hint { font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📱 Компонент: Empty Chat Mobile (Пустой чат — mobile)</h1>

    <div class="demo-section">
      <div class="demo-label">Пустой чат — мобильная версия</div>
      <div class="mobile-frame">
        <div class="topbar">
          <div class="topbar__title">Иван Иванов</div>
        </div>
        <div class="empty-chat-mobile">
          <div class="empty-chat-mobile__animation">💬</div>
          <div class="empty-chat-mobile__title">Начните диалог</div>
          <div class="empty-chat-mobile__subtitle">Это начало вашей истории сообщений. Напишите первое сообщение!</div>
          <div class="empty-chat-mobile__hint">Сообщения шифруются end-to-end</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
