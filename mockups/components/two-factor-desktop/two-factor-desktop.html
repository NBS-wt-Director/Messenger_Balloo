<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: Two Factor Desktop — Двухфакторная аутентификация (desktop)</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 560px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .two-factor-desktop {
      background: var(--bg-glass);
      backdrop-filter: blur(var(--blur));
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-glass);
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 440px;
      margin: 0 auto;
    }
    .two-factor-desktop__icon {
      width: 64px; height: 64px;
      clip-path: var(--octagon-clip);
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin: 0 auto;
    }
    .two-factor-desktop__title { font-size: 20px; font-weight: 700; color: var(--text-primary); text-align: center; }
    .two-factor-desktop__desc { font-size: 14px; color: var(--text-secondary); text-align: center; line-height: 1.6; }
    .two-factor-desktop__code-inputs { display: flex; gap: 8px; justify-content: center; }
    .two-factor-desktop__code-input {
      width: 48px; height: 56px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      outline: none;
    }
    .two-factor-desktop__code-input:focus { border-color: var(--accent); }
    .two-factor-desktop__resend { font-size: 13px; color: var(--text-muted); text-align: center; }
    .two-factor-desktop__resend strong { color: var(--accent); }
    .two-factor-desktop__backup {
      padding: 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .two-factor-desktop__backup code {
      display: block;
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      color: var(--text-primary);
      margin: 4px 0;
      letter-spacing: 1px;
    }
    .two-factor-desktop__footer { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>🖥 Компонент: Two Factor Desktop (Двухфакторная аутентификация — desktop)</h1>

    <div class="demo-section">
      <div class="demo-label">Ввод 2FA — десктопное модальное окно</div>
      <div class="two-factor-desktop">
        <div class="two-factor-desktop__icon">🔐</div>
        <div class="two-factor-desktop__title">Двухфакторная аутентификация</div>
        <div class="two-factor-desktop__desc">Введите 6-значный код из приложения-аутентификатора</div>
        <div class="two-factor-desktop__code-inputs">
          <input class="two-factor-desktop__code-input" maxlength="1" value="1">
          <input class="two-factor-desktop__code-input" maxlength="1" value="2">
          <input class="two-factor-desktop__code-input" maxlength="1" value="3">
          <input class="two-factor-desktop__code-input" maxlength="1" value="4">
          <input class="two-factor-desktop__code-input" maxlength="1">
          <input class="two-factor-desktop__code-input" maxlength="1">
        </div>
        <div class="two-factor-desktop__resend">Повторная отправка через <strong>30</strong> сек</div>
        <div class="two-factor-desktop__backup">
          Резервные коды:
          <code>XXXX-XXXX-XXXX</code>
          <code>XXXX-XXXX-XXXX</code>
        </div>
        <div class="two-factor-desktop__footer">
          <button class="btn btn--secondary btn--sm">Отмена</button>
          <button class="btn btn--primary btn--sm">Подтвердить</button>
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
