<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: Group Settings — Настройки группы</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 480px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .group-settings { display: flex; flex-direction: column; }
    .group-settings__header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 8px;
    }
    .group-settings__header .avatar { flex-shrink: 0; }
    .group-settings__header__info { flex: 1; }
    .group-settings__header__name { font-size: 18px; font-weight: 700; color: var(--text-primary); }
    .group-settings__header__members { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .group-settings__section { padding: 12px 0; border-bottom: 1px solid var(--border-color); }
    .group-settings__section-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .group-settings__row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }
    .group-settings__row-label { font-size: 14px; color: var(--text-primary); }
    .group-settings__row-value { font-size: 13px; color: var(--text-secondary); }
    .group-settings__danger-zone { padding: 12px 0; }
    .group-settings__danger-btn {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--danger);
      background: transparent;
      border: 1px solid var(--danger);
      cursor: pointer;
      text-align: center;
    }
    .group-settings__danger-btn:hover { background: var(--danger-bg); }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📦 Компонент: Group Settings (Настройки группы)</h1>

    <div class="demo-section">
      <div class="demo-label">Настройки группы</div>
      <div class="group-settings">
        <div class="group-settings__header">
          <div class="avatar avatar--lg avatar--bordered avatar--status-online avatar--ctx-contact" style="background: var(--accent);">
            <div class="avatar__inner"><span>КТ</span></div>
          </div>
          <div class="group-settings__header__info">
            <div class="group-settings__header__name">Команда</div>
            <div class="group-settings__header__members">5 участников · 2 онлайн</div>
          </div>
        </div>

        <div class="group-settings__section">
          <div class="group-settings__section-title">Общие</div>
          <div class="group-settings__row">
            <span class="group-settings__row-label">Название</span>
            <span class="group-settings__row-value">Команда</span>
          </div>
          <div class="group-settings__row">
            <span class="group-settings__row-label">Описание</span>
            <span class="group-settings__row-value">Рабочая группа</span>
          </div>
          <div class="group-settings__row">
            <span class="group-settings__row-label">Ссылка</span>
            <span class="group-settings__row-value" style="color: var(--accent);">t.me/команда</span>
          </div>
        </div>

        <div class="group-settings__section">
          <div class="group-settings__section-title">Участники</div>
          <div class="group-settings__row">
            <span class="group-settings__row-label">Добавить участника</span>
            <span class="group-settings__row-value" style="color: var(--accent);">+</span>
          </div>
          <div class="group-settings__row">
            <span class="group-settings__row-label">Право отправок</span>
            <span class="group-settings__row-value">Все участники</span>
          </div>
        </div>

        <div class="group-settings__danger-zone">
          <button class="group-settings__danger-btn">Покинуть группу</button>
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
