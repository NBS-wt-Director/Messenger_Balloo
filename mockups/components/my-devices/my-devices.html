<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: My Devices — Мои устройства</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 480px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .device-list { display: flex; flex-direction: column; gap: 2px; }
    .device-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
    }
    .device-item + .device-item { border-top: none; }
    .device-item--current { border-left: 3px solid var(--accent); }
    .device-item__icon { font-size: 24px; width: 36px; text-align: center; flex-shrink: 0; }
    .device-item__info { flex: 1; min-width: 0; }
    .device-item__name { font-weight: 600; color: var(--text-primary); font-size: 14px; }
    .device-item__detail { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .device-item__detail--muted { color: var(--text-muted); }
    .device-item__status {
      font-size: 11px;
      padding: 3px 8px;
      font-weight: 600;
      margin-bottom: 4px;
      display: inline-block;
    }
    .device-item__status--current { background: rgba(45,184,77,0.12); color: var(--accent); }
    .device-item__action {
      padding: 6px 12px;
      font-size: 12px;
      color: var(--danger);
      cursor: pointer;
      border: 1px solid var(--danger);
    }
    .device-item__action:hover { background: var(--danger-bg); }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📦 Компонент: My Devices (Мои устройства)</h1>

    <div class="demo-section">
      <div class="demo-label">Список устройств</div>
      <div class="device-list">
        <div class="device-item device-item--current">
          <div class="device-item__icon">💻</div>
          <div class="device-item__info">
            <div class="device-item__name">Windows PC — Chrome</div>
            <div class="device-item__detail">IP: 192.168.1.1</div>
            <div class="device-item__detail device-item__detail--muted">Москва, Россия · Сейчас</div>
          </div>
          <div>
            <div class="device-item__status device-item__status--current">Текущее</div>
          </div>
        </div>
        <div class="device-item">
          <div class="device-item__icon">📱</div>
          <div class="device-item__info">
            <div class="device-item__name">iPhone 15 — Balloo App</div>
            <div class="device-item__detail">IP: 10.0.0.5</div>
            <div class="device-item__detail device-item__detail--muted">Москва, Россия · 2 ч назад</div>
          </div>
          <div class="device-item__action">Отзыв</div>
        </div>
        <div class="device-item">
          <div class="device-item__icon">🖥</div>
          <div class="device-item__info">
            <div class="device-item__name">MacBook Pro — Safari</div>
            <div class="device-item__detail">IP: 172.16.0.1</div>
            <div class="device-item__detail device-item__detail--muted">Москва, Россия · 3 дня назад</div>
          </div>
          <div class="device-item__action">Отзыв</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
