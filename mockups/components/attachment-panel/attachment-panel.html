<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: Attachment Panel — Панель вложений</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 560px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .attachment-panel {
      background: var(--bg-glass);
      backdrop-filter: blur(var(--blur));
      border: 1px solid var(--border-strong);
      border-radius: 0;
      box-shadow: var(--shadow-glass);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .attachment-panel__grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .attachment-panel__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 8px;
      cursor: pointer;
      transition: background 0.15s;
      border-radius: 0;
    }
    .attachment-panel__item:hover { background: var(--bg-hover); }
    .attachment-panel__icon {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
    }
    .attachment-panel__label {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.3;
    }
    .attachment-panel__photo { grid-column: span 2; }
    .attachment-panel__photo .attachment-panel__icon { background: var(--accent); color: #fff; border: none; }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📦 Компонент: Attachment Panel (Панель вложений)</h1>

    <div class="demo-section">
      <div class="demo-label">Панель вложений в input-area</div>
      <div class="attachment-panel">
        <div class="attachment-panel__grid">
          <div class="attachment-panel__item attachment-panel__photo">
            <div class="attachment-panel__icon">📷</div>
            <div class="attachment-panel__label">Фото</div>
          </div>
          <div class="attachment-panel__item attachment-panel__photo">
            <div class="attachment-panel__icon">🎥</div>
            <div class="attachment-panel__label">Видео</div>
          </div>
          <div class="attachment-panel__item">
            <div class="attachment-panel__icon">📎</div>
            <div class="attachment-panel__label">Файл</div>
          </div>
          <div class="attachment-panel__item">
            <div class="attachment-panel__icon">📍</div>
            <div class="attachment-panel__label">Геолокация</div>
          </div>
          <div class="attachment-panel__item">
            <div class="attachment-panel__icon">👤</div>
            <div class="attachment-panel__label">Контакт</div>
          </div>
          <div class="attachment-panel__item">
            <div class="attachment-panel__icon">📊</div>
            <div class="attachment-panel__label">Опрос</div>
          </div>
          <div class="attachment-panel__item">
            <div class="attachment-panel__icon">🎵</div>
            <div class="attachment-panel__label">Аудио</div>
          </div>
          <div class="attachment-panel__item">
            <div class="attachment-panel__icon">🎤</div>
            <div class="attachment-panel__label">Голосовое</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
