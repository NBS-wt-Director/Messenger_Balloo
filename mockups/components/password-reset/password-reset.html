<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: Password Reset — Восстановление пароля</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 480px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .password-reset { display: flex; flex-direction: column; gap: 16px; }
    .password-reset .form-input { background: var(--bg-tertiary); border: 1px solid var(--border-color); color: var(--text-primary); padding: 10px 14px; font-size: 14px; outline: none; }
    .password-reset .form-input:focus { border-color: var(--accent); }
    .password-reset .form-input::placeholder { color: var(--text-muted); }
    .password-reset .form-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block; }
    .password-reset .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .password-reset .step { display: none; }
    .password-reset .step--active { display: block; }
    .password-reset .code-inputs { display: flex; gap: 8px; justify-content: center; }
    .password-reset .code-input {
      width: 48px; height: 56px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      outline: none;
    }
    .password-reset .code-input:focus { border-color: var(--accent); }
    .password-reset .strength-bar { height: 4px; background: var(--bg-tertiary); margin-top: 8px; }
    .password-reset .strength-bar__fill { height: 100%; transition: width 0.3s, background 0.3s; }
    .password-reset .strength-bar__fill--weak { width: 33%; background: var(--danger); }
    .password-reset .strength-bar__fill--medium { width: 66%; background: var(--warning); }
    .password-reset .strength-bar__fill--strong { width: 100%; background: var(--accent); }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📦 Компонент: Password Reset (Восстановление пароля)</h1>

    <div class="demo-section">
      <div class="demo-label">Шаг 1: Email / Телефон</div>
      <div class="password-reset">
        <div class="form-label">Email или телефон</div>
        <input class="form-input" type="text" placeholder="example@mail.ru">
        <div class="form-hint">Мы отправим код подтверждения</div>
        <button class="btn btn--primary btn--block">Отправить код</button>
      </div>
    </div>

    <div class="demo-section">
      <div class="demo-label">Шаг 2: Код подтверждения</div>
      <div class="password-reset">
        <div class="form-label">Код из письма</div>
        <div class="code-inputs">
          <input class="code-input" type="text" maxlength="1" value="4">
          <input class="code-input" type="text" maxlength="1" value="8">
          <input class="code-input" type="text" maxlength="1" value="2">
          <input class="code-input" type="text" maxlength="1" value="7">
          <input class="code-input" type="text" maxlength="1">
          <input class="code-input" type="text" maxlength="1">
        </div>
        <div class="form-hint text-center">Отправить код повторно через <strong style="color:var(--accent)">45</strong> сек</div>
        <button class="btn btn--primary btn--block">Проверить</button>
      </div>
    </div>

    <div class="demo-section">
      <div class="demo-label">Шаг 3: Новый пароль</div>
      <div class="password-reset">
        <div class="form-label">Новый пароль</div>
        <input class="form-input" type="password" placeholder="Введите новый пароль" value="MyP@ssw0rd">
        <div class="password-reset strength-bar">
          <div class="strength-bar__fill strength-bar__fill--strong"></div>
        </div>
        <div class="form-hint">Минимум 8 символов, буква и цифра</div>
        <div class="form-label" style="margin-top:8px;">Подтвердите пароль</div>
        <input class="form-input" type="password" placeholder="Повторите пароль" value="MyP@ssw0rd">
        <button class="btn btn--primary btn--block" style="margin-top:8px;">Сменить пароль</button>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
