<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Компонент: Voice Record Mobile — Запись голосового (mobile)</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    body { background: var(--bg-primary); }
    .mobile-frame {
      width: 375px;
      height: 812px;
      margin: 0 auto;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .mobile-frame .topbar { height: 48px; font-size: 16px; }
    .component-demo { padding: 24px; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .voice-record-mobile {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
    }
    .voice-record-mobile__timer {
      font-size: 32px;
      font-weight: 300;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }
    .voice-record-mobile__waveform {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 60px;
    }
    .voice-record-mobile__waveform-bar {
      width: 4px;
      background: var(--danger);
      border-radius: 0;
      animation: waveform 0.8s ease-in-out infinite alternate;
    }
    @keyframes waveform {
      from { height: 8px; }
      to { height: 50px; }
    }
    .voice-record-mobile__waveform-bar:nth-child(1) { animation-delay: 0s; }
    .voice-record-mobile__waveform-bar:nth-child(2) { animation-delay: 0.1s; }
    .voice-record-mobile__waveform-bar:nth-child(3) { animation-delay: 0.2s; }
    .voice-record-mobile__waveform-bar:nth-child(4) { animation-delay: 0.3s; }
    .voice-record-mobile__waveform-bar:nth-child(5) { animation-delay: 0.15s; }
    .voice-record-mobile__waveform-bar:nth-child(6) { animation-delay: 0.25s; }
    .voice-record-mobile__waveform-bar:nth-child(7) { animation-delay: 0.05s; }
    .voice-record-mobile__btn {
      width: 72px;
      height: 72px;
      clip-path: var(--octagon-clip);
      background: var(--danger);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .voice-record-mobile__hint { font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📱 Компонент: Voice Record Mobile (Запись голосового — mobile)</h1>

    <div class="demo-section">
      <div class="demo-label">Запись голосового — мобильный интерфейс</div>
      <div class="mobile-frame">
        <div class="topbar"><div class="topbar__title">Иван Иванов</div></div>
        <div class="voice-record-mobile">
          <div class="voice-record-mobile__timer">0:03</div>
          <div class="voice-record-mobile__waveform">
            <div class="voice-record-mobile__waveform-bar"></div>
            <div class="voice-record-mobile__waveform-bar"></div>
            <div class="voice-record-mobile__waveform-bar"></div>
            <div class="voice-record-mobile__waveform-bar"></div>
            <div class="voice-record-mobile__waveform-bar"></div>
            <div class="voice-record-mobile__waveform-bar"></div>
            <div class="voice-record-mobile__waveform-bar"></div>
          </div>
          <div class="voice-record-mobile__btn" title="Остановить запись">⏹</div>
          <div class="voice-record-mobile__hint">Отпустите для отправки</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
