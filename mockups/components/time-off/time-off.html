<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: Time Off — Отпуска и отсутствие</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 560px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .time-off-list { display: flex; flex-direction: column; gap: 2px; }
    .time-off-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
    }
    .time-off-item + .time-off-item { border-top: none; }
    .time-off-item__avatar { flex-shrink: 0; }
    .time-off-item__info { flex: 1; }
    .time-off-item__name { font-weight: 600; color: var(--text-primary); font-size: 14px; }
    .time-off-item__dates { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .time-off-item__type { font-size: 11px; padding: 3px 8px; font-weight: 600; margin-top: 4px; display: inline-block; }
    .time-off-item__type--vacation { background: rgba(45,184,77,0.12); color: var(--accent); }
    .time-off-item__type--sick { background: rgba(227,66,45,0.12); color: var(--danger); }
    .time-off-item__type--remote { background: rgba(59,158,255,0.12); color: var(--info); }
    .time-off-item__status { font-size: 12px; padding: 3px 10px; font-weight: 700; }
    .time-off-item__status--pending { background: rgba(232,163,23,0.12); color: var(--warning); }
    .time-off-item__status--approved { background: rgba(45,184,77,0.12); color: var(--accent); }
    .time-off-item__status--rejected { background: rgba(227,66,45,0.12); color: var(--danger); }
    .time-off-balance {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .time-off-balance__card {
      flex: 1;
      padding: 16px;
      background: var(--bg-glass);
      border: 1px solid var(--border-color);
      text-align: center;
    }
    .time-off-balance__card__value { font-size: 24px; font-weight: 800; color: var(--accent); }
    .time-off-balance__card__label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📦 Компонент: Time Off (Отпуска и отсутствие)</h1>

    <div class="demo-section">
      <div class="demo-label">Баланс дней</div>
      <div class="time-off-balance">
        <div class="time-off-balance__card"><div class="time-off-balance__card__value">24</div><div class="time-off-balance__card__label">Осталось дней</div></div>
        <div class="time-off-balance__card"><div class="time-off-balance__card__value" style="color:var(--text-primary);">6</div><div class="time-off-balance__card__label">Использовано</div></div>
        <div class="time-off-balance__card"><div class="time-off-balance__card__value" style="color:var(--text-primary);">30</div><div class="time-off-balance__card__label">Всего</div></div>
      </div>
      <div class="demo-label">Заявки</div>
      <div class="time-off-list">
        <div class="time-off-item">
          <div class="time-off-item__avatar"><div class="avatar avatar--sm" style="background:var(--accent);color:#fff;clip-path:var(--octagon-clip);font-size:11px;display:inline-flex;align-items:center;justify-content:center;">ИИ</div></div>
          <div class="time-off-item__info">
            <div class="time-off-item__name">Иван Иванов</div>
            <div class="time-off-item__dates">01.08 — 14.08.2026</div>
            <div class="time-off-item__type time-off-item__type--vacation">Отпуск</div>
          </div>
          <div class="time-off-item__status time-off-item__status--approved">Одобрено</div>
        </div>
        <div class="time-off-item">
          <div class="time-off-item__avatar"><div class="avatar avatar--sm" style="background:#3b9eff;color:#fff;clip-path:var(--octagon-clip);font-size:11px;display:inline-flex;align-items:center;justify-content:center;">МС</div></div>
          <div class="time-off-item__info">
            <div class="time-off-item__name">Мария С.</div>
            <div class="time-off-item__dates">28.07 — 30.07.2026</div>
            <div class="time-off-item__type time-off-item__type--remote">Удалёнка</div>
          </div>
          <div class="time-off-item__status time-off-item__status--pending">На рассмотрении</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
