<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: Message Editor — Редактор сообщения</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 560px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .message-editor {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }
    .message-editor__toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .message-editor__toolbar-btn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); cursor: pointer;
      font-size: 14px;
      border-radius: 0;
    }
    .message-editor__toolbar-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
    .message-editor__toolbar-btn--active { color: var(--accent); }
    .message-editor__field {
      flex: 1;
      min-height: 40px;
      max-height: 120px;
      padding: 10px 14px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 14px;
      resize: none;
      outline: none;
      line-height: 1.5;
    }
    .message-editor__field:focus { border-color: var(--accent); }
    .message-editor__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-top: 1px solid var(--border-color);
    }
    .message-editor__chars { font-size: 11px; color: var(--text-muted); }
    .message-editor__reply {
      padding: 6px 12px;
      border-left: 3px solid var(--accent);
      background: var(--bg-tertiary);
      margin: 8px 12px;
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .message-editor__reply-author { font-weight: 600; color: var(--text-primary); }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📦 Компонент: Message Editor (Редактор сообщения)</h1>

    <div class="demo-section">
      <div class="demo-label">Редактор с ответом</div>
      <div class="message-editor">
        <div class="message-editor__reply">
          <span class="message-editor__reply-author">Иван Иванов:</span>
          <span>Привет! Как дела?</span>
          <span style="margin-left:auto; cursor:pointer; color:var(--text-muted);">✕</span>
        </div>
        <div class="message-editor__toolbar">
          <div class="message-editor__toolbar-btn" title="Жирный"><strong>B</strong></div>
          <div class="message-editor__toolbar-btn" title="Курсив"><em>I</em></div>
          <div class="message-editor__toolbar-btn" title="Код">{ }</div>
          <div class="message-editor__toolbar-btn" title="Ссылка">🔗</div>
          <div class="message-editor__toolbar-btn" title="Зачеркнуть">S</div>
        </div>
        <textarea class="message-editor__field" placeholder="Написать сообщение...">Привет! Всё отлично, спасибо! 😊</textarea>
        <div class="message-editor__footer">
          <span class="message-editor__chars">38 / 1024</span>
          <div style="display:flex; gap:8px;">
            <button class="btn btn--tertiary btn--sm">Отмена</button>
            <button class="btn btn--primary btn--sm">Отправить</button>
          </div>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <div class="demo-label">Редактор без ответа</div>
      <div class="message-editor">
        <div class="message-editor__toolbar">
          <div class="message-editor__toolbar-btn" title="Жирный"><strong>B</strong></div>
          <div class="message-editor__toolbar-btn" title="Курсив"><em>I</em></div>
          <div class="message-editor__toolbar-btn" title="Код">{ }</div>
          <div class="message-editor__toolbar-btn" title="Ссылка">🔗</div>
          <div class="message-editor__toolbar-btn" title="Зачеркнуть">S</div>
        </div>
        <textarea class="message-editor__field" placeholder="Написать сообщение..."></textarea>
        <div class="message-editor__footer">
          <span class="message-editor__chars">0 / 1024</span>
          <div style="display:flex; gap:8px;">
            <button class="btn btn--primary btn--sm">Отправить</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
