<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: Settings — Настройки приложения</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 480px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .settings-menu { display: flex; flex-direction: column; }
    .settings-menu__item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .settings-menu__item:hover { opacity: 0.7; }
    .settings-menu__icon {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .settings-menu__label {
      flex: 1;
      font-size: 15px;
      color: var(--text-primary);
    }
    .settings-menu__chevron {
      font-size: 12px;
      color: var(--text-muted);
    }
    .settings-menu__divider { height: 1px; background: var(--border-color); margin: 0; }
    .settings-menu__danger { color: var(--danger); }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📦 Компонент: Settings (Настройки приложения)</h1>

    <div class="demo-section">
      <div class="demo-label">Меню настроек</div>
      <div class="settings-menu">
        <div class="settings-menu__item" onclick="alert('Переход: Уведомления')">
          <div class="settings-menu__icon">🔔</div>
          <div class="settings-menu__label">Уведомления</div>
          <div class="settings-menu__chevron">›</div>
        </div>
        <div class="settings-menu__item" onclick="alert('Переход: Приватность')">
          <div class="settings-menu__icon">🔒</div>
          <div class="settings-menu__label">Приватность</div>
          <div class="settings-menu__chevron">›</div>
        </div>
        <div class="settings-menu__item" onclick="alert('Переход: Аккаунты')">
          <div class="settings-menu__icon">👤</div>
          <div class="settings-menu__label">Аккаунты</div>
          <div class="settings-menu__chevron">›</div>
        </div>
        <div class="settings-menu__item">
          <div class="settings-menu__icon">🌐</div>
          <div class="settings-menu__label">Язык</div>
          <div class="settings-menu__label" style="font-size:13px;color:var(--text-secondary);margin:0;">Русский</div>
          <div class="settings-menu__chevron">›</div>
        </div>
        <div class="settings-menu__item">
          <div class="settings-menu__icon">🎨</div>
          <div class="settings-menu__label">Тема оформления</div>
          <div class="settings-menu__label" style="font-size:13px;color:var(--text-secondary);margin:0;">Тёмная</div>
          <div class="settings-menu__chevron">›</div>
        </div>
        <div class="settings-menu__divider"></div>
        <div class="settings-menu__item">
          <div class="settings-menu__icon">📱</div>
          <div class="settings-menu__label">Мои устройства</div>
          <div class="settings-menu__chevron">›</div>
        </div>
        <div class="settings-menu__item">
          <div class="settings-menu__icon">🔑</div>
          <div class="settings-menu__label">Восстановление пароля</div>
          <div class="settings-menu__chevron">›</div>
        </div>
        <div class="settings-menu__divider"></div>
        <div class="settings-menu__item" style="padding:14px 0;">
          <div class="settings-menu__icon" style="color:var(--danger);">🚪</div>
          <div class="settings-menu__label settings-menu__danger">Выйти</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
