<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: My Donates — Мои донаты</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 480px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .donate-list { display: flex; flex-direction: column; gap: 2px; }
    .donate-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
    }
    .donate-item + .donate-item { border-top: none; }
    .donate-item__icon { font-size: 24px; width: 40px; text-align: center; flex-shrink: 0; }
    .donate-item__info { flex: 1; min-width: 0; }
    .donate-item__amount { font-weight: 700; color: var(--accent); font-size: 16px; }
    .donate-item__date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .donate-item__status { font-size: 11px; padding: 3px 8px; font-weight: 600; }
    .donate-item__status--success { background: rgba(45,184,77,0.12); color: var(--accent); }
    .donate-item__status--pending { background: rgba(232,163,23,0.12); color: var(--warning); }
    .donate-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: var(--bg-glass);
      border: 1px solid var(--border-color);
      margin-bottom: 12px;
    }
    .donate-total__label { font-size: 14px; color: var(--text-secondary); }
    .donate-total__value { font-size: 24px; font-weight: 800; color: var(--accent); }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📦 Компонент: My Donates (Мои донаты)</h1>

    <div class="demo-section">
      <div class="demo-label">Общая сумма</div>
      <div class="donate-total">
        <span class="donate-total__label">Всего поддержано</span>
        <span class="donate-total__value">1 250 ₽</span>
      </div>
    </div>

    <div class="demo-section">
      <div class="demo-label">История донатов</div>
      <div class="donate-list">
        <div class="donate-item">
          <div class="donate-item__icon">💚</div>
          <div class="donate-item__info">
            <div class="donate-item__amount">500 ₽</div>
            <div class="donate-item__date">15 июля 2026</div>
          </div>
          <div class="donate-item__status donate-item__status--success">Оплачено</div>
        </div>
        <div class="donate-item">
          <div class="donate-item__icon">💚</div>
          <div class="donate-item__info">
            <div class="donate-item__amount">250 ₽</div>
            <div class="donate-item__date">10 июля 2026</div>
          </div>
          <div class="donate-item__status donate-item__status--success">Оплачено</div>
        </div>
        <div class="donate-item">
          <div class="donate-item__icon">⏳</div>
          <div class="donate-item__info">
            <div class="donate-item__amount">500 ₽</div>
            <div class="donate-item__date">23 июля 2026</div>
          </div>
          <div class="donate-item__status donate-item__status--pending">Ожидание</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
