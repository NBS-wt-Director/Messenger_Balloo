<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: Voice Message — Голосовое сообщение</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 480px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .voice-message {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      max-width: 320px;
    }
    .voice-message__play {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      clip-path: var(--octagon-clip);
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .voice-message__waveform {
      flex: 1;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .voice-message__waveform-bar {
      width: 3px;
      background: var(--border-strong);
      border-radius: 0;
      transition: background 0.15s;
    }
    .voice-message__waveform-bar--played { background: var(--accent); }
    .voice-message__duration {
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
      min-width: 40px;
      text-align: right;
    }
    .voice-message--recording {
      background: var(--danger-bg);
      border-color: var(--danger);
    }
    .voice-message--recording .voice-message__play {
      background: var(--danger);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📦 Компонент: Voice Message (Голосовое сообщение)</h1>

    <div class="demo-section">
      <div class="demo-label">Отправленное голосовое</div>
      <div class="voice-message">
        <div class="voice-message__play" onclick="this.textContent = this.textContent === '▶' ? '⏸' : '▶'">▶</div>
        <div class="voice-message__waveform">
          <div class="voice-message__waveform-bar voice-message__waveform-bar--played" style="height:12px"></div>
          <div class="voice-message__waveform-bar voice-message__waveform-bar--played" style="height:20px"></div>
          <div class="voice-message__waveform-bar voice-message__waveform-bar--played" style="height:28px"></div>
          <div class="voice-message__waveform-bar voice-message__waveform-bar--played" style="height:16px"></div>
          <div class="voice-message__waveform-bar voice-message__waveform-bar--played" style="height:24px"></div>
          <div class="voice-message__waveform-bar" style="height:18px"></div>
          <div class="voice-message__waveform-bar" style="height:14px"></div>
          <div class="voice-message__waveform-bar" style="height:22px"></div>
          <div class="voice-message__waveform-bar" style="height:10px"></div>
          <div class="voice-message__waveform-bar" style="height:16px"></div>
        </div>
        <div class="voice-message__duration">0:12</div>
      </div>
    </div>

    <div class="demo-section">
      <div class="demo-label">Запись голосового</div>
      <div class="voice-message voice-message--recording">
        <div class="voice-message__play">⏹</div>
        <div class="voice-message__waveform">
          <div class="voice-message__waveform-bar" style="height:8px;background:var(--danger)"></div>
          <div class="voice-message__waveform-bar" style="height:16px;background:var(--danger)"></div>
          <div class="voice-message__waveform-bar" style="height:24px;background:var(--danger)"></div>
          <div class="voice-message__waveform-bar" style="height:12px;background:var(--danger)"></div>
          <div class="voice-message__waveform-bar" style="height:20px;background:var(--danger)"></div>
          <div class="voice-message__waveform-bar" style="height:14px;background:var(--danger)"></div>
          <div class="voice-message__waveform-bar" style="height:18px;background:var(--danger)"></div>
          <div class="voice-message__waveform-bar" style="height:10px;background:var(--danger)"></div>
        </div>
        <div class="voice-message__duration" style="color:var(--danger);">0:03</div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
