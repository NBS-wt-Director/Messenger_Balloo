<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: File Viewer — Просмотр файла</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 560px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .file-viewer {
      background: var(--bg-glass);
      backdrop-filter: blur(var(--blur));
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-glass);
      overflow: hidden;
    }
    .file-viewer__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .file-viewer__name {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 14px;
    }
    .file-viewer__size {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 8px;
    }
    .file-viewer__actions {
      display: flex;
      gap: 4px;
    }
    .file-viewer__action-btn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); cursor: pointer;
    }
    .file-viewer__action-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
    .file-viewer__preview {
      height: 300px;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      color: var(--text-muted);
    }
    .file-viewer__preview--image { background-size: contain; background-position: center; background-repeat: no-repeat; }
    .file-viewer__footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .file-viewer__info {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
    }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📦 Компонент: File Viewer (Просмотр файла)</h1>

    <div class="demo-section">
      <div class="demo-label">Просмотр изображения</div>
      <div class="file-viewer">
        <div class="file-viewer__header">
          <div>
            <span class="file-viewer__name">photo.jpg</span>
            <span class="file-viewer__size">2.4 MB</span>
          </div>
          <div class="file-viewer__actions">
            <div class="file-viewer__action-btn" title="Скачать">⬇</div>
            <div class="file-viewer__action-btn" title="Поделиться">↗</div>
            <div class="file-viewer__action-btn" title="Закрыть">✕</div>
          </div>
        </div>
        <div class="file-viewer__preview file-viewer__preview--image">🖼</div>
        <div class="file-viewer__info">
          <span>1920 × 1080</span>
          <span>JPEG</span>
          <span>2.4 MB</span>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <div class="demo-label">Просмотр документа</div>
      <div class="file-viewer">
        <div class="file-viewer__header">
          <div>
            <span class="file-viewer__name">document.pdf</span>
            <span class="file-viewer__size">1.8 MB</span>
          </div>
          <div class="file-viewer__actions">
            <div class="file-viewer__action-btn" title="Скачать">⬇</div>
            <div class="file-viewer__action-btn" title="Поделиться">↗</div>
            <div class="file-viewer__action-btn" title="Закрыть">✕</div>
          </div>
        </div>
        <div class="file-viewer__preview">📄</div>
        <div class="file-viewer__footer">
          <button class="btn btn--secondary btn--sm">Предпросмотр</button>
          <button class="btn btn--primary btn--sm">Скачать</button>
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
