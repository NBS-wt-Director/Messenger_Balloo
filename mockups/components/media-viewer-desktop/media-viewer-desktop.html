<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: Media Viewer Desktop — Просмотр медиа (desktop)</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 800px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .media-viewer-desktop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }
    .media-viewer-desktop__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
    }
    .media-viewer-desktop__back {
      display: flex; align-items: center; gap: 8px;
      color: #fff; font-size: 14px; cursor: pointer;
    }
    .media-viewer-desktop__back:hover { opacity: 0.7; }
    .media-viewer-desktop__actions { display: flex; gap: 16px; }
    .media-viewer-desktop__action-btn {
      color: #fff; font-size: 18px; cursor: pointer; opacity: 0.8;
    }
    .media-viewer-desktop__action-btn:hover { opacity: 1; }
    .media-viewer-desktop__content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      font-size: 120px;
      position: relative;
    }
    .media-viewer-desktop__nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      background: rgba(255,255,255,0.1);
    }
    .media-viewer-desktop__nav:hover { background: rgba(255,255,255,0.2); }
    .media-viewer-desktop__nav--prev { left: 16px; }
    .media-viewer-desktop__nav--next { right: 16px; }
    .media-viewer-desktop__footer {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
    }
    .media-viewer-desktop__count { color: rgba(255,255,255,0.6); font-size: 13px; }
    .media-viewer-desktop__reply {
      display: flex;
      gap: 8px;
      flex: 1;
      margin-left: 16px;
    }
    .media-viewer-desktop__reply .input-area__field {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
      color: #fff;
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>🖥 Компонент: Media Viewer Desktop (Просмотр медиа — desktop)</h1>

    <div class="demo-section">
      <div class="demo-label">Полноэкранный просмотр медиа — desktop</div>
      <div class="media-viewer-desktop">
        <div class="media-viewer-desktop__header">
          <div class="media-viewer-desktop__back">← Назад</div>
          <div class="media-viewer-desktop__actions">
            <div class="media-viewer-desktop__action-btn">⬇</div>
            <div class="media-viewer-desktop__action-btn">↗</div>
            <div class="media-viewer-desktop__action-btn">✕</div>
          </div>
        </div>
        <div class="media-viewer-desktop__content">
          🖼
          <div class="media-viewer-desktop__nav media-viewer-desktop__nav--prev">‹</div>
          <div class="media-viewer-desktop__nav media-viewer-desktop__nav--next">›</div>
        </div>
        <div class="media-viewer-desktop__footer">
          <div class="media-viewer-desktop__count">1 / 5</div>
          <div class="media-viewer-desktop__reply">
            <input class="input-area__field" placeholder="Комментарий...">
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
