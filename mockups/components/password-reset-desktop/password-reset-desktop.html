<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: Password Reset Desktop — Восстановление пароля (desktop)</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 560px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .password-reset-desktop {
      background: var(--bg-glass);
      backdrop-filter: blur(var(--blur));
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-glass);
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 440px;
      margin: 0 auto;
    }
    .password-reset-desktop__step { display: none; }
    .password-reset-desktop__step--active { display: flex; flex-direction: column; gap: 16px; }
    .password-reset-desktop__title { font-size: 20px; font-weight: 700; color: var(--text-primary); text-align: center; }
    .password-reset-desktop__desc { font-size: 14px; color: var(--text-secondary); text-align: center; line-height: 1.5; }
    .password-reset-desktop__input {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
    }
    .password-reset-desktop__input:focus { border-color: var(--accent); }
    .password-reset-desktop__input::placeholder { color: var(--text-muted); }
    .password-reset-desktop__code-inputs { display: flex; gap: 8px; justify-content: center; }
    .password-reset-desktop__code-input {
      width: 48px; height: 56px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      outline: none;
    }
    .password-reset-desktop__code-input:focus { border-color: var(--accent); }
    .password-reset-desktop__hint { font-size: 13px; color: var(--text-muted); text-align: center; }
    .password-reset-desktop__hint strong { color: var(--accent); }
    .password-reset-desktop__strength { height: 4px; background: var(--bg-tertiary); }
    .password-reset-desktop__strength__fill { height: 100%; width: 100%; background: var(--accent); transition: width 0.3s, background 0.3s; }
    .password-reset-desktop__footer { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>🖥 Компонент: Password Reset Desktop (Восстановление пароля — desktop)</h1>

    <div class="demo-section">
      <div class="demo-label">Восстановление пароля — десктопное модальное окно</div>
      <div class="password-reset-desktop">
        <div class="password-reset-desktop__step password-reset-desktop__step--active">
          <div class="password-reset-desktop__title">Шаг 1: Email</div>
          <div class="password-reset-desktop__desc">Введите email или телефон для восстановления доступа</div>
          <input class="password-reset-desktop__input" type="text" placeholder="example@mail.ru">
          <button class="btn btn--primary btn--block">Отправить код</button>
        </div>
        <div class="password-reset-desktop__step password-reset-desktop__step--active">
          <div class="password-reset-desktop__title">Шаг 2: Код</div>
          <div class="password-reset-desktop__desc">Введите 6-значный код из письма</div>
          <div class="password-reset-desktop__code-inputs">
            <input class="password-reset-desktop__code-input" maxlength="1" value="4">
            <input class="password-reset-desktop__code-input" maxlength="1" value="8">
            <input class="password-reset-desktop__code-input" maxlength="1" value="2">
            <input class="password-reset-desktop__code-input" maxlength="1" value="7">
            <input class="password-reset-desktop__code-input" maxlength="1">
            <input class="password-reset-desktop__code-input" maxlength="1">
          </div>
          <div class="password-reset-desktop__hint">Повторная отправка через <strong>30</strong> сек</div>
          <button class="btn btn--primary btn--block">Проверить</button>
        </div>
        <div class="password-reset-desktop__step password-reset-desktop__step--active">
          <div class="password-reset-desktop__title">Шаг 3: Новый пароль</div>
          <input class="password-reset-desktop__input" type="password" placeholder="Новый пароль" value="MyP@ssw0rd">
          <div class="password-reset-desktop__strength"><div class="password-reset-desktop__strength__fill"></div></div>
          <input class="password-reset-desktop__input" type="password" placeholder="Подтвердите пароль" value="MyP@ssw0rd">
          <div class="password-reset-desktop__footer">
            <button class="btn btn--secondary btn--sm">Отмена</button>
            <button class="btn btn--primary btn--sm">Сменить пароль</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
