<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Компонент: Media Viewer Mobile — Просмотр медиа (mobile)</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    body { background: var(--bg-primary); }
    .mobile-frame {
      width: 375px;
      height: 812px;
      margin: 0 auto;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .mobile-frame .topbar { height: 48px; font-size: 16px; }
    .component-demo { padding: 24px; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .media-viewer-mobile {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }
    .media-viewer-mobile__header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
    }
    .media-viewer-mobile__back {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; cursor: pointer;
    }
    .media-viewer-mobile__count {
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      margin-left: 12px;
    }
    .media-viewer-mobile__actions {
      margin-left: auto;
      display: flex; gap: 12px;
    }
    .media-viewer-mobile__action-btn {
      color: #fff; font-size: 18px; cursor: pointer;
    }
    .media-viewer-mobile__content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      font-size: 80px;
    }
    .media-viewer-mobile__footer {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      background: rgba(0,0,0,0.5);
    }
    .media-viewer-mobile__footer .input-area__field {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📱 Компонент: Media Viewer Mobile (Просмотр медиа — mobile)</h1>

    <div class="demo-section">
      <div class="demo-label">Просмотр медиа — мобильный оверлей</div>
      <div class="media-viewer-mobile">
        <div class="media-viewer-mobile__header">
          <div class="media-viewer-mobile__back">←</div>
          <div class="media-viewer-mobile__count">1 / 5</div>
          <div class="media-viewer-mobile__actions">
            <div class="media-viewer-mobile__action-btn">↗</div>
            <div class="media-viewer-mobile__action-btn">⋯</div>
          </div>
        </div>
        <div class="media-viewer-mobile__content">🖼</div>
        <div class="media-viewer-mobile__footer">
          <input class="input-area__field" placeholder="Комментарий...">
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
