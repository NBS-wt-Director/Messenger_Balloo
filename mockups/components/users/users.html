<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: Users — Пользователи (админ)</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 640px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .admin-users__table { width: 100%; border-collapse: collapse; }
    .admin-users__table th { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-color); }
    .admin-users__table td { padding: 12px; font-size: 14px; color: var(--text-primary); border-bottom: 1px solid var(--border-color); }
    .admin-users__table__row:hover td { background: var(--bg-hover); }
    .admin-users__table__name { font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .admin-users__table__status { font-size: 12px; padding: 3px 8px; font-weight: 600; }
    .admin-users__table__status--active { background: rgba(45,184,77,0.12); color: var(--accent); }
    .admin-users__table__status--banned { background: rgba(227,66,45,0.12); color: var(--danger); }
    .admin-users__table__actions { display: flex; gap: 8px; }
    .admin-users__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .admin-users__header__title { font-size: 16px; font-weight: 700; color: var(--text-primary); }
    .admin-users__header__search { width: 240px; }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📦 Компонент: Users (Пользователи — админ)</h1>

    <div class="demo-section">
      <div class="demo-label">Таблица пользователей</div>
      <div class="admin-users__header">
        <div class="admin-users__header__title">Пользователи (12 450)</div>
        <input class="search-input admin-users__header__search" placeholder="Поиск...">
      </div>
      <table class="admin-users__table">
        <thead><tr><th>Пользователь</th><th>ID</th><th>Статус</th><th>Зарегистрирован</th><th>Действия</th></tr></thead>
        <tbody>
          <tr class="admin-users__table__row">
            <td><div class="admin-users__table__name"><div class="avatar avatar--sm" style="background:var(--accent);color:#fff;clip-path:var(--octagon-clip);font-size:11px;display:inline-flex;align-items:center;justify-content:center;">ИИ</div>Иван Иванов</div></td>
            <td style="font-family:monospace;font-size:12px;color:var(--text-muted);">clxxx123</td>
            <td><span class="admin-users__table__status admin-users__table__status--active">Активен</span></td>
            <td style="color:var(--text-muted);font-size:13px;">12.01.2026</td>
            <td><div class="admin-users__table__actions"><button class="bots-table__action-btn">Профиль</button><button class="bots-table__action-btn bots-table__action-btn--danger">Бан</button></div></td>
          </tr>
          <tr class="admin-users__table__row">
            <td><div class="admin-users__table__name"><div class="avatar avatar--sm" style="background:#a855f7;color:#fff;clip-path:var(--octagon-clip);font-size:11px;display:inline-flex;align-items:center;justify-content:center;">МС</div>Мария С.</div></td>
            <td style="font-family:monospace;font-size:12px;color:var(--text-muted);">clxxx456</td>
            <td><span class="admin-users__table__status admin-users__table__status--banned">Заблокирован</span></td>
            <td style="color:var(--text-muted);font-size:13px;">05.03.2026</td>
            <td><div class="admin-users__table__actions"><button class="bots-table__action-btn">Профиль</button><button class="bots-table__action-btn bots-table__action-btn--danger">Разбан</button></div></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
