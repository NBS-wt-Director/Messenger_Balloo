<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компонент: Texts — Тексты (админ)</title>
  <link rel="stylesheet" href="../../assets/common.css">
  <style>
    .component-demo { padding: 24px; max-width: 640px; margin: 0 auto; }
    .component-demo h1 { font-size: 20px; margin-bottom: 16px; }
    .component-demo .demo-section { margin-bottom: 24px; }
    .component-demo .demo-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .admin-texts__table { width: 100%; border-collapse: collapse; }
    .admin-texts__table th { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-color); }
    .admin-texts__table td { padding: 12px; font-size: 14px; color: var(--text-primary); border-bottom: 1px solid var(--border-color); }
    .admin-texts__table__row:hover td { background: var(--bg-hover); }
    .admin-texts__table__key { font-family: 'Fira Code', monospace; font-size: 13px; color: var(--accent); }
    .admin-texts__table__lang { font-size: 11px; padding: 2px 6px; background: var(--bg-tertiary); color: var(--text-secondary); }
    .admin-texts__table__actions { display: flex; gap: 8px; }
    .admin-texts__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .admin-texts__header__title { font-size: 16px; font-weight: 700; color: var(--text-primary); }
  </style>
</head>
<body>
  <div class="component-demo">
    <h1>📦 Компонент: Texts (Тексты — админ)</h1>

    <div class="demo-section">
      <div class="demo-label">Управление текстами</div>
      <div class="admin-texts__header">
        <div class="admin-texts__header__title">Тексты (156)</div>
        <button class="btn btn--primary btn--sm">+ Добавить</button>
      </div>
      <table class="admin-texts__table">
        <thead><tr><th>Ключ</th><th>Язык</th><th>Текст</th><th>Действия</th></tr></thead>
        <tbody>
          <tr class="admin-texts__table__row">
            <td class="admin-texts__table__key">onboarding.welcome.title</td>
            <td><span class="admin-texts__table__lang">RU</span></td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Добро пожаловать в Balloo!</td>
            <td><div class="admin-texts__table__actions"><button class="bots-table__action-btn">Ред.</button></div></td>
          </tr>
          <tr class="admin-texts__table__row">
            <td class="admin-texts__table__key">onboarding.welcome.title</td>
            <td><span class="admin-texts__table__lang">EN</span></td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Welcome to Balloo!</td>
            <td><div class="admin-texts__table__actions"><button class="bots-table__action-btn">Ред.</button></div></td>
          </tr>
          <tr class="admin-texts__table__row">
            <td class="admin-texts__table__key">chats.empty.title</td>
            <td><span class="admin-texts__table__lang">RU</span></td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Начните диалог</td>
            <td><div class="admin-texts__table__actions"><button class="bots-table__action-btn">Ред.</button></div></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <script src="../../assets/common.js"></script>
</body>
</html>
