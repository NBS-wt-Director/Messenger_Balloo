<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop — Восстановление пароля</title>
  <link rel="stylesheet" href="../assets/common.css">
  <style>
    html { overflow-y: auto; height: auto; }
    body { overflow-y: auto; height: auto; min-height: 100vh; }
    .window-frame { width: 100%; max-width: 1000px; margin: 24px auto; background: var(--bg-primary); border: 2px solid var(--border-strong); box-shadow: var(--shadow-glass); overflow: hidden; }
    .titlebar { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--bg-glass); border-bottom: 1px solid var(--border-color); }
    .titlebar__dot { width: 12px; height: 12px; }
    .titlebar__title { flex:1; text-align:center; font-size:12px; color:var(--text-muted); }
  </style>
</head>
<body>
<div class="window-frame">
  <div class="titlebar">
    <div class="titlebar__dot" style="background:#ff5f57;"></div>
    <div class="titlebar__dot" style="background:#ffbd2e;"></div>
    <div class="titlebar__dot" style="background:#28ca42;"></div>
    <span class="titlebar__title">Balloo — Восстановление пароля</span>
  </div>
  <div style="display:flex;flex-direction:column;height:680px;">
    <div class="topbar" style="flex-shrink:0;">
      <div class="topbar__logo"><div class="topbar__logo-icon">B</div><span>Balloo</span></div>
      <div class="topbar__title">Восстановление пароля</div>
      <div class="topbar__right"><span class="topbar__theme" data-theme-toggle>🌙 Тёмная</span></div>
    </div>
    <div class="auth-container" style="flex:1;">
      <div class="auth-card">
        <div class="onboarding__illustration" style="width:80px;height:80px;font-size:36px;margin-bottom:16px;">🔑</div>
        <div class="auth-title">Восстановление пароля</div>
        <div class="auth-subtitle">Введите email — мы отправим ссылку для сброса</div>
        <div class="form-group"><input type="email" class="form-input" placeholder="your@email.com"></div>
        <button class="btn btn--primary btn--block">Отправить ссылку</button>
        <div class="divider"></div>
        <div class="card" style="background:rgba(59,158,255,0.08);border-color:var(--info);padding:12px;">
          <div class="text-sm" style="color:var(--info);">📧 Подтверждение email</div>
          <div class="text-xs text-secondary mt-2">Email не подтверждён. <a href="#" style="color:var(--accent);">Отправить письмо</a></div>
        </div>
        <button class="btn btn--tertiary btn--block mt-4">← Вернуться ко входу</button>
      </div>
    </div>
  </div>
</div>
<script src="../assets/common.js"></script>
</body>
</html>
