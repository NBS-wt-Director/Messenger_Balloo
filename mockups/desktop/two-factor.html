<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop — 2FA</title>
  <link rel="stylesheet" href="../assets/common.css">
  <style>
    html { overflow-y: auto; height: auto; }
    body { overflow-y: auto; height: auto; min-height: 100vh; }
    .window-frame { width: 100%; max-width: 1000px; margin: 24px auto; background: var(--bg-primary); border: 2px solid var(--border-strong); box-shadow: var(--shadow-glass); overflow: hidden; }
    .titlebar { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--bg-glass); border-bottom: 1px solid var(--border-color); }
    .titlebar__dot { width: 12px; height: 12px; }
    .titlebar__title { flex:1; text-align:center; font-size:12px; color:var(--text-muted); }
  </style>
</head>
<body>
<div class="window-frame">
  <div class="titlebar">
    <div class="titlebar__dot" style="background:#ff5f57;"></div>
    <div class="titlebar__dot" style="background:#ffbd2e;"></div>
    <div class="titlebar__dot" style="background:#28ca42;"></div>
    <span class="titlebar__title">Balloo — Двухфакторная аутентификация</span>
  </div>
  <div style="display:flex;flex-direction:column;height:680px;">
    <div class="topbar" style="flex-shrink:0;">
      <div class="topbar__logo"><div class="topbar__logo-icon">B</div><span>Balloo</span></div>
      <div class="topbar__title">Двухфакторная аутентификация</div>
      <div class="topbar__right"><span class="topbar__theme" data-theme-toggle>🌙 Тёмная</span></div>
    </div>
    <div class="content overflow-y-auto" style="flex:1;">
      <div class="page-container page-container--narrow">
        <div class="page-title">🔐 2FA</div>
        <div class="card mb-4" style="display:flex;align-items:center;gap:12px;">
          <div style="width:40px;height:40px;clip-path:var(--octagon-clip);background:var(--accent);display:flex;align-items:center;justify-content:center;">🔐</div>
          <div style="flex:1;"><div class="font-bold">2FA включена</div><div class="text-sm text-secondary">Коды обновляются каждые 30 сек</div></div>
          <span class="chip chip--accent">Активна</span>
        </div>
        <div class="card mb-4" style="text-align:center;">
          <div style="width:180px;height:180px;margin:0 auto 12px;background:#fff;display:flex;align-items:center;justify-content:center;">
            <div style="display:grid;grid-template-columns:repeat(21,1fr);width:160px;height:160px;"><div style="background:#000;grid-column:span 21;grid-row:span 7;"></div><div style="background:#000;grid-column:span 7;grid-row:span 14;"></div><div style="background:#000;grid-column:span 21;grid-row:span 7;"></div></div>
          </div>
          <code style="display:block;padding:8px;background:var(--bg-tertiary);color:var(--accent);">JBSWY3DPEHPK3PXP</code>
        </div>
        <div class="form-group"><label class="form-label">6-значный код</label><input type="text" class="form-input" placeholder="000 000" maxlength="7" style="text-align:center;font-size:20px;letter-spacing:6px;"></div>
        <button class="btn btn--primary btn--block mb-4">Подтвердить</button>
        <div class="card mb-4">
          <div class="text-sm text-secondary mb-2">Backup-коды:</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-family:monospace;">
            <code style="padding:6px;background:var(--bg-tertiary);color:var(--text-primary);">8XK2-9PQ1</code>
            <code style="padding:6px;background:var(--bg-tertiary);color:var(--text-primary);">M4RT-7VW2</code>
            <code style="padding:6px;background:var(--bg-tertiary);color:var(--text-primary);">B3LD-5NZ8</code>
            <code style="padding:6px;background:var(--bg-tertiary);color:var(--text-primary);">Q1YH-6KX9</code>
            <code style="padding:6px;background:var(--bg-tertiary);color:var(--text-primary);">T2WP-8CJ4</code>
            <code style="padding:6px;background:var(--bg-tertiary);color:var(--text-primary);">F7DM-3RLS</code>
          </div>
          <button class="btn btn--secondary btn--sm mt-4">🔄 Перегенерировать</button>
        </div>
        <button class="btn btn--danger btn--block">Отключить 2FA</button>
      </div>
    </div>
  </div>
</div>
<script src="../assets/common.js"></script>
</body>
</html>
