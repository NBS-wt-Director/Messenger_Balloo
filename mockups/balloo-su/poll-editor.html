<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloo — Создание опроса</title>
  <link rel="stylesheet" href="../assets/common.css">
</head>
<body class="app-flex">

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar__logo">
    <div class="topbar__logo-icon">B</div>
    <span>Balloo</span>
  </div>
  <div class="topbar__title" onclick="window.location.href='chats.html'">Создание опроса</div>
  <div class="topbar__right">
    <div class="avatar avatar--sm avatar--bordered avatar--status-online avatar--ctx-contact" onclick="window.location.href='profile.html'">
      <div class="avatar__inner"><span>ИИ</span></div>
    </div>
    <span class="topbar__theme" data-theme-toggle>🌙 Тёмная</span>
  </div>
</div>

<!-- Main: chat behind overlay -->
<div class="main">
  <div class="sidebar">
    <div class="sidebar__search">
      <input type="text" class="search-input" placeholder="🔍 Поиск чатов...">
    </div>
    <div class="list">
      <div class="list__item list__item--active">
        <div class="avatar avatar--md avatar--bordered avatar--status-online avatar--ctx-contact">
          <div class="avatar__inner"><span>МА</span></div>
        </div>
        <div class="list__item-body">
          <div class="list__item-title">Мария Андреева</div>
          <div class="list__item-subtitle text-muted">опрос создаётся…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Content: dimmed chat + poll editor overlay -->
  <div class="content" style="position:relative;">
    <div style="padding:60px 24px;opacity:0.35;">
      <div class="message message--receiver">
        <div class="message__bubble">
          <div class="message__body">Какой цвет для акцента?</div>
        </div>
      </div>
    </div>

    <!-- Poll Editor Overlay -->
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;">
      <div class="card" style="width:100%;max-width:520px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <span class="font-bold" style="font-size:18px;color:var(--text-primary);">📊 Создать интерактив</span>
          <div class="topbar__actions-btn" onclick="window.location.href='chats.html'">✕</div>
        </div>

        <!-- Type tabs -->
        <div class="tabs mb-4">
          <div class="tab tab--active" data-type="poll" onclick="selectPollType(this,'poll')">📊 Опрос</div>
          <div class="tab" data-type="quiz" onclick="selectPollType(this,'quiz')">🎯 Квиз</div>
          <div class="tab" data-type="active_list" onclick="selectPollType(this,'active_list')">✅ Актив. список</div>
          <div class="tab" data-type="passive_list" onclick="selectPollType(this,'passive_list')">📋 Пассив. список</div>
          <div class="tab" data-type="personali" onclick="selectPollType(this,'personali')">👤 Персонали</div>
        </div>

        <div class="form-group">
          <label class="form-label">Вопрос / заголовок</label>
          <input type="text" class="form-input" placeholder="Введите вопрос..." value="Какой цвет для акцента?">
        </div>

        <div class="form-group">
          <label class="form-label">Варианты ответа</label>
          <div id="options-list">
            <div style="display:flex;gap:8px;margin-bottom:8px;">
              <input type="text" class="form-input" placeholder="Вариант 1" value="Зелёный">
              <button class="topbar__actions-btn" title="Удалить">🗑</button>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:8px;">
              <input type="text" class="form-input" placeholder="Вариант 2" value="Мятный">
              <button class="topbar__actions-btn" title="Удалить">🗑</button>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:8px;">
              <input type="text" class="form-input" placeholder="Вариант 3" value="Бирюзовый">
              <button class="topbar__actions-btn" title="Удалить">🗑</button>
            </div>
          </div>
          <button class="btn btn--tertiary btn--sm mt-2">+ Добавить вариант</button>
        </div>

        <!-- Quiz-only: correct answer -->
        <div class="form-group" id="quiz-correct" style="display:none;">
          <label class="form-label">Правильный ответ (квиз)</label>
          <select class="form-select">
            <option>Зелёный</option>
            <option>Мятный</option>
            <option>Бирюзовый</option>
          </select>
        </div>

        <!-- Settings -->
        <div class="form-group">
          <label class="form-checkbox">
            <input type="checkbox" checked>
            <span>Анонимное голосование</span>
          </label>
        </div>
        <div class="form-group">
          <label class="form-checkbox">
            <input type="checkbox">
            <span>Множественный выбор</span>
          </label>
        </div>
        <div class="form-group">
          <label class="form-checkbox">
            <input type="checkbox" checked>
            <span>Можно переслать</span>
          </label>
        </div>
        <div class="form-group">
          <label class="form-label">Срок действия</label>
          <select class="form-select">
            <option>24 часа</option>
            <option>12 часов</option>
            <option>1 час</option>
            <option>Без ограничений</option>
          </select>
        </div>

        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button class="btn btn--tertiary" onclick="window.location.href='chats.html'">Отмена</button>
          <button class="btn btn--primary" onclick="window.location.href='chats.html'">Создать</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/common.js"></script>
<script>
function selectPollType(el, type) {
  document.querySelectorAll('.tab[data-type]').forEach(t => t.classList.remove('tab--active'));
  el.classList.add('tab--active');
  document.getElementById('quiz-correct').style.display = (type === 'quiz') ? 'block' : 'none';
}
</script>
</body>
</html>
