<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloo — 403 Доступ запрещён</title>
  <link rel="stylesheet" href="../assets/common.css">
  <style>
    .error-page { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:calc(100vh - 56px); padding:40px 24px; text-align:center; }
    .error-code { font-size:120px; font-weight:900; color:var(--danger); line-height:1; margin-bottom:8px; letter-spacing:-4px; }
    .error-mascot { font-size:72px; margin-bottom:16px; }
    .error-title { font-size:24px; font-weight:800; color:var(--text-primary); margin-bottom:8px; }
    .error-desc { font-size:16px; color:var(--text-secondary); max-width:420px; line-height:1.6; margin-bottom:28px; }
    .error-actions { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  </style>
</head>
<body>
<div class="topbar">
  <div class="topbar__logo"><div class="topbar__logo-icon">B</div><span>Balloo</span></div>
  <div class="topbar__title">Ошибка 403</div>
  <div class="topbar__right"><div class="mascot">🦊</div><span class="topbar__lang" data-lang-toggle>🇷🇺 RU</span><span class="topbar__theme" data-theme-toggle>🌙 Тёмная</span></div>
</div>
<div class="main"><div class="content overflow-y-auto">
  <div class="error-page">
    <div class="error-mascot">🦊🚫</div>
    <div class="error-code">403</div>
    <h1 class="error-title">Доступ запрещён</h1>
    <p class="error-desc">У вас нет прав для просмотра этой страницы. Если вы считаете, что это ошибка — свяжитесь с администратором.</p>
    <div class="error-actions">
      <button class="btn btn--primary" onclick="history.back()">← Назад</button>
      <a class="btn btn--secondary" href="/">На главную</a>
    </div>
  </div>
</div></div>
<script src="../assets/common.js"></script>
</body>
</html>
