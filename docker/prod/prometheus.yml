# Balloo Messenger — Prometheus Configuration
# Production environment

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# ─── Alertmanager ───
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ─── Rule files ───
rule_files:

# ─── Scrape configs ───
scrape_configs:
  # ─── Node Exporter (если запущен отдельно) ───
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

  # ─── Prometheus self-monitoring ───
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ─── Balloo Server (Express + Prometheus metrics) ───
  - job_name: 'balloo-server'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['server:3000']
    # ─── TLS (раскомментировать для production) ───
    # tls_config:
    #   insecure_skip_verify: true

  # ─── PostgreSQL (через postgres_exporter) ───
  # - job_name: 'postgres'
