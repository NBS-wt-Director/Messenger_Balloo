# ============================================
# Balloo Messenger — host nginx: STEP 2 (final, SSL)
# Положить на сервер: /etc/nginx/sites-available/balloo.conf
# (заменяет bootstrap-версию после получения сертификата)
# ============================================
# Архитектура мультипроектного сервера:
#   SSL-терминация здесь (хостовый nginx, уже обслуживает 80/443)
#   → прокси на 127.0.0.1:8080 (web, контейнер balloo-web)
#   → прокси на 127.0.0.1:3100 (api/ws, контейнер balloo-server)
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name balloo.su app.balloo.su api.balloo.su admin.balloo.su
                docs.balloo.su download.balloo.su features.balloo.su
                history.balloo.su command.balloo.su blog.balloo.su;

    # ACME challenge — для автопродления сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 включать только если хостовый nginx >= 1.25: строка "http2 on;"

    server_name balloo.su app.balloo.su api.balloo.su admin.balloo.su
                docs.balloo.su download.balloo.su features.balloo.su
                history.balloo.su command.balloo.su blog.balloo.su;

    # ─── SSL (сертификат выпускается certbot'ом хоста) ───
    ssl_certificate /etc/letsencrypt/live/balloo.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balloo.su/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/balloo.su/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:balloo_ssl:10m;
    ssl_session_timeout 1d;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;

    # ─── Health check → server ───
    location /health {
        proxy_pass http://127.0.0.1:3100/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    # ─── API → server ───
    location /api/ {
        proxy_pass http://127.0.0.1:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ─── Uploads — большие таймауты ───
    location /api/upload/ {
        proxy_pass http://127.0.0.1:3100/api/upload/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 100M;
    }

    # ─── WebSocket → server ───
    location /ws/ {
        proxy_pass http://127.0.0.1:3100/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── Всё остальное (SPA) → web ───
    location / {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}