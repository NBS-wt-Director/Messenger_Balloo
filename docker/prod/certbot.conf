# Balloo Messenger — Certbot (Let's Encrypt) Nginx Configuration
# Используется для получения/обновления SSL-сертификатов
# Запуск: docker compose run --rm certbot certonly ...
#
# ЭТА ФАЙЛ НЕ ИСПОЛЬЗУЕТСЯ ОСНОВНЫМ NGINX — ТОЛЬКО ДЛЯ CERTBOT
# Основной конфиг: nginx-production.conf

# ─── Worker settings ───
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ─── MIME types ───
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Minimal logging for ACME challenge ───
    access_log /var/log/nginx/acme_access.log;
    error_log /var/log/nginx/acme_error.log;

    # ─── Performance ───
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 10;
    server_tokens off;

    # ─── HTTP server — only for ACME challenge ───
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name balloo.su app.balloo.su api.balloo.su
                    admin.balloo.su
                    download.balloo.su
                    features.balloo.su
                    history.balloo.su
                    command.balloo.su
                    blog.balloo.su
                    docs.balloo.su;

        # ACME challenge — certbot пишет сюда временные файлы
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Всё остальное — отклоняем (SSL не нужен для ACME)
        location / {
            return 444;
        }
    }
}
