# ============================================
# Balloo Messenger — Local Build Compose
# Сборка образов ПРЯМО НА СЕРВЕРЕ (без GHCR)
# Сервер мультипроектный: SSL-терминацию делает
# ХОСТОВЫЙ nginx, поэтому:
#   - nginx-контейнера НЕТ
#   - все порты публикуются только на 127.0.0.1
#   - Postgres/Redis наружу не торчат вообще
# ============================================
# Запуск:
#   cd ~/balloo/docker/prod
#   docker compose -f docker-compose.local.yml --env-file .env.production up -d --build
# ============================================

version: '3.8'

x-common-variables: &common-vars
  POSTGRES_USER: ${POSTGRES_USER:-balloo}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-balloo}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_ACCESS_EXPIRES_IN: "900"
  JWT_REFRESH_EXPIRES_IN: "2592000"
  NODE_ENV: production
  SERVER_PORT: "3000"
  SERVER_HOST: "0.0.0.0"
  CORS_ORIGIN: ${CORS_ORIGIN:-https://balloo.su}
  ADMIN_INSTALL_PASSWORD: ${ADMIN_INSTALL_PASSWORD}
  SETUP_PASSWORD: ${SETUP_PASSWORD}
  MAX_FILE_SIZE: ${MAX_FILE_SIZE:-52428800}
  CDN_BASE_URL: https://cdn.balloo.su
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-balloo-minio}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

services:
  # ─── PostgreSQL 16 (БД не торчит наружу) ───
  postgres:
    image: postgres:16-alpine
    container_name: balloo-postgres
    restart: always
    environment:
      <<: *common-vars
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-balloo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - balloo-net

  # ─── Redis 7 (не торчит наружу) ───
  redis:
    image: redis:7-alpine
    container_name: balloo-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - balloo-net

  # ─── MinIO (S3 storage; наружу — только консоль на localhost) ───
  minio:
    image: minio/minio:latest
    container_name: balloo-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-balloo-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - balloo-net

  # ─── Backend (сборка локально) ───
  server:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.server
    image: balloo/server:local
    container_name: balloo-server
    restart: always
    ports:
      - "127.0.0.1:${SERVER_HOST_PORT:-3100}:3000"
    environment:
      <<: *common-vars
      DATABASE_URL: postgresql://${POSTGRES_USER:-balloo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-balloo}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@balloo.su}
      SMTP_TLS: ${SMTP_TLS:-true}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      VK_CLIENT_SECRET: ${VK_CLIENT_SECRET:-}
      VK_REDIRECT_URI: ${VK_REDIRECT_URI:-}
      MAILRU_CLIENT_ID: ${MAILRU_CLIENT_ID:-}
      MAILRU_CLIENT_SECRET: ${MAILRU_CLIENT_SECRET:-}
      MAILRU_REDIRECT_URI: ${MAILRU_REDIRECT_URI:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_API_KEY: ${YOOKASSA_API_KEY:-}
      YOOKASSA_WEBHOOK_URL: ${YOOKASSA_WEBHOOK_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@balloo.su}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9090}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - balloo-net

  # ─── Frontend (сборка локально, web на 127.0.0.1:8080) ───
  web:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.web
    image: balloo/web:local
    container_name: balloo-web
    restart: always
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - balloo-net

  # ─── Monitoring (запускается только с --profile monitoring) ───
  prometheus:
    image: prom/prometheus:latest
    container_name: balloo-prometheus
    restart: always
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9091}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - balloo-net

  grafana:
    image: grafana/grafana:latest
    container_name: balloo-grafana
    restart: always
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3002}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-balloo123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.balloo.su
      GF_SECURITY_COOKIE_SECURE: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - balloo-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: balloo-alertmanager
    restart: always
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9094}:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - balloo-net

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  balloo-net:
    driver: bridge