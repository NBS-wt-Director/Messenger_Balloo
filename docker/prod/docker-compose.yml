# Balloo Messenger — Production Docker Compose
# Версия: 1.0 | Дата: 2026-07-30
version: '3.8'

services:
  # ============================================
  # PostgreSQL 16 — основная БД
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: balloo-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-balloo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-balloo}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-balloo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ============================================
  # Redis 7 — кэш и сессии
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: balloo-redis-prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ============================================
  # MinIO — S3-совместимое хранилище файлов
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: balloo-minio-prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-balloo-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-balloo-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ============================================
  # Server — бэкенд (2 реплики)
  # ============================================
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: balloo-server-prod
    restart: always
    ports:
      - "3100:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-balloo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-balloo}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: "900"
      JWT_REFRESH_EXPIRES_IN: "2592000"
      NODE_ENV: production
      SERVER_PORT: 3000
      SERVER_HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN:-https://balloo.su}
      ADMIN_INSTALL_PASSWORD: ${ADMIN_INSTALL_PASSWORD:-131013}
      SETUP_PASSWORD: ${SETUP_PASSWORD:-06041996ОИА}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-52428800}
      CDN_BASE_URL: https://cdn.balloo.su
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-balloo-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-balloo-minio-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ============================================
  # Web — фронтенд (nginx)
  # ============================================
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: balloo-web-prod
    restart: always
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # ============================================
  # Nginx — фронтальный прокси + SSL termination
  # ============================================
  nginx:
    image: nginx:1.25-alpine
    container_name: balloo-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - server
      - web
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  # ============================================
  # Prometheus — сбор метрик
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: balloo-prometheus-prod
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--enable-feature=exemplar-storage"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ============================================
  # Grafana — дашборды и визуализация
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: balloo-grafana-prod
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-balloo123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.balloo.su
      GF_SECURITY_COOKIE_SECURE: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # ============================================
  # Alertmanager — алерты
  # ============================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: balloo-alertmanager-prod
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
