# ============================================
# Balloo Messenger — host nginx: STEP 1 (bootstrap, HTTP only)
# Положить на сервер: /etc/nginx/sites-available/balloo.conf
# (или в conf.d — в зависимости от структуры хостового nginx)
# ============================================
# Используется ДО получения сертификата, чтобы certbot
# смог пройти HTTP-01 challenge. После получения сертификата
# заменяется на nginx-host-balloo-ssl.conf
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name balloo.su app.balloo.su api.balloo.su admin.balloo.su
                docs.balloo.su download.balloo.su features.balloo.su
                history.balloo.su command.balloo.su blog.balloo.su;

    # ACME challenge для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Пока сертификата нет
    location / {
        return 503 "balloo: waiting for SSL certificate";
    }
}