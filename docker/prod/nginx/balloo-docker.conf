# Balloo Messenger — Docker containers proxy

# WebSocket upgrade: Connection: upgrade только когда клиент реально его просит.
# Имя переменной уникально (balloo_*), чтобы не конфликтовать с чужими конфигами.
map $http_upgrade $balloo_upgrade_connection {
    default upgrade;
    ''      close;
}

# API (backend)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.balloo.su www.api.balloo.su;

    ssl_certificate /etc/letsencrypt/live/api.balloo.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.balloo.su/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 120m;

    # Health-пробы — только по basic-auth (файл /etc/nginx/.htpasswd-balloo).
    # Healthcheck'и контейнеров ходят на 127.0.0.1:3100 напрямую, мимо nginx.
    location ~ ^/(health|health/ready)(/|$) {
        auth_basic           "balloo probes";
        auth_basic_user_file /etc/nginx/.htpasswd-balloo;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $balloo_upgrade_connection;
    }
}

server {
    listen 80;
    server_name api.balloo.su www.api.balloo.su;
    return 301 https://$server_name$request_uri;
}

# Web (frontend SPA)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name balloo.su www.balloo.su;

    ssl_certificate /etc/letsencrypt/live/balloo.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balloo.su/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 120m;

    # Content-Security-Policy (тикет 1792318174; живой хостовый nginx, не
    # docker/prod/nginx-production.conf — прод TLS-терминируется здесь).
    # script-src: 'self' + mc.yandex.ru (Яндекс.Метрика 112269610, lazy по consent)
    # frame-src 'none': OAuth (Яндекс/VK/Mail.ru) — 302 redirect, не iframe
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://api.balloo.su https://balloo.su https://cdn.balloo.su https://mc.yandex.ru wss://api.balloo.su; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-src 'none'; media-src 'self' https: data:;" always;

    # Health-пробы — только по basic-auth (см. api-блок выше).
    location ~ ^/(health|health/ready)(/|$) {
        auth_basic           "balloo probes";
        auth_basic_user_file /etc/nginx/.htpasswd-balloo;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $balloo_upgrade_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name balloo.su www.balloo.su;
    return 301 https://$server_name$request_uri;
}

# Features (витрина фич — отдельный SPA-контейнер)
# Требует: DNS A-запись features.balloo.su → 50.114.224.3
#          и сертификат: certbot --nginx -d features.balloo.su
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name features.balloo.su www.features.balloo.su;

    ssl_certificate /etc/letsencrypt/live/features.balloo.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/features.balloo.su/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 120m;

    # CSP для features-SPA (тикет 1792318174; Метрика здесь не ставится)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://api.balloo.su; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-src 'none'" always;

    # Health-пробы — только по basic-auth (см. api-блок выше).
    location ~ ^/(health|health/ready)(/|$) {
        auth_basic           "balloo probes";
        auth_basic_user_file /etc/nginx/.htpasswd-balloo;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Features SPA
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name features.balloo.su www.features.balloo.su;
    return 301 https://$server_name$request_uri;
}

# Web-admin (админ-панель — отдельный SPA-контейнер balloo-web-admin:8092)
# Тикеты 1792395490-05, 1792812416. Сертификат: общий balloo.su (SAN-лист
# balloo.su-0001 от 15.10.2026 включает admin.balloo.su — проверить батчем C:
#   echo | openssl s_client -connect 127.0.0.1:443 -servername admin.balloo.su 2>/dev/null \
#     | openssl x509 -noout -ext subjectAltName)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.balloo.su www.admin.balloo.su;

    ssl_certificate /etc/letsencrypt/live/balloo.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balloo.su/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    # CSP для админки (без Метрики; API — только api.balloo.su)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://api.balloo.su; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-src 'none'" always;

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin SPA
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name admin.balloo.su www.admin.balloo.su;
    return 301 https://$server_name$request_uri;
}
