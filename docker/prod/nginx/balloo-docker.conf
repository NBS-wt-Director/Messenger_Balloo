# Balloo Messenger — Docker containers proxy

# WebSocket upgrade: Connection: upgrade только когда клиент реально его просит.
# Имя переменной уникально (balloo_*), чтобы не конфликтовать с чужими конфигами.
map $http_upgrade $balloo_upgrade_connection {
    default upgrade;
    ''      close;
}

# API (backend)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.balloo.su www.api.balloo.su;

    ssl_certificate /etc/letsencrypt/live/api.balloo.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.balloo.su/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 120m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $balloo_upgrade_connection;
    }
}

server {
    listen 80;
    server_name api.balloo.su www.api.balloo.su;
    return 301 https://$server_name$request_uri;
}

# Web (frontend SPA)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name balloo.su www.balloo.su;

    ssl_certificate /etc/letsencrypt/live/balloo.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balloo.su/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 120m;

    # WebSocket
    location /ws/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $balloo_upgrade_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name balloo.su www.balloo.su;
    return 301 https://$server_name$request_uri;
}
