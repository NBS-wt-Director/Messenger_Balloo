# ============================================
# Balloo Messenger — Production Docker Compose
# Для удалённого сервера (SSH deploy)
# Версия: 2.0 | Дата: 2026-08-17
# ============================================
# Архитектура:
#   Локально → GitHub Actions → GHCR → SSH на сервер → docker compose pull + up
# ============================================

version: '3.8'

x-common-variables: &common-vars
  POSTGRES_USER: ${POSTGRES_USER:-balloo}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-balloo}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_ACCESS_EXPIRES_IN: "900"
  JWT_REFRESH_EXPIRES_IN: "2592000"
  NODE_ENV: production
  SERVER_PORT: "3000"
  SERVER_HOST: "0.0.0.0"
  CORS_ORIGIN: ${CORS_ORIGIN:-https://balloo.su}
  ADMIN_INSTALL_PASSWORD: ${ADMIN_INSTALL_PASSWORD}
  SETUP_PASSWORD: ${SETUP_PASSWORD}
  MAX_FILE_SIZE: ${MAX_FILE_SIZE:-52428800}
  CDN_BASE_URL: https://cdn.balloo.su
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-balloo-minio}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

services:
  # ─── PostgreSQL 16 ───
  postgres:
    image: postgres:16-alpine
    container_name: balloo-postgres
    restart: always
    environment:
      <<: *common-vars
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-balloo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - balloo-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ─── Redis 7 ───
  redis:
    image: redis:7-alpine
    container_name: balloo-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - balloo-net
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ─── MinIO (S3 storage) ───
  minio:
    image: minio/minio:latest
    container_name: balloo-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-balloo-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - balloo-net
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ─── Backend Server (из GHCR) ───
  server:
    image: ghcr.io/${GITHUB_REPOSITORY:-balloo-team/balloo}/server:server-${DEPLOY_SHA:-latest}
    container_name: balloo-server
    restart: always
    ports:
      - "3100:3000"
    environment:
      <<: *common-vars
      DATABASE_URL: postgresql://${POSTGRES_USER:-balloo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-balloo}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@balloo.su}
      SMTP_TLS: ${SMTP_TLS:-true}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      VK_CLIENT_SECRET: ${VK_CLIENT_SECRET:-}
      VK_REDIRECT_URI: ${VK_REDIRECT_URI:-}
      MAILRU_CLIENT_ID: ${MAILRU_CLIENT_ID:-}
      MAILRU_CLIENT_SECRET: ${MAILRU_CLIENT_SECRET:-}
      MAILRU_REDIRECT_URI: ${MAILRU_REDIRECT_URI:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_API_KEY: ${YOOKASSA_API_KEY:-}
      YOOKASSA_WEBHOOK_URL: ${YOOKASSA_WEBHOOK_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@balloo.su}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9090}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - balloo-net
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ─── Frontend Web (из GHCR) ───
  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-balloo-team/balloo}/web:web-${DEPLOY_SHA:-latest}
    container_name: balloo-web
    restart: always
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - balloo-net
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # ─── Nginx (фронтальный прокси + SSL) ───
  nginx:
    image: nginx:1.25-alpine
    container_name: balloo-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-production.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - ./certbot:/var/www/certbot:ro
    depends_on:
      - server
      - web
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - balloo-net
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  # ─── Prometheus ───
  prometheus:
    image: prom/prometheus:latest
    container_name: balloo-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - balloo-net
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ─── Grafana ───
  grafana:
    image: grafana/grafana:latest
    container_name: balloo-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-balloo123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.balloo.su
      GF_SECURITY_COOKIE_SECURE: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - balloo-net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # ─── Alertmanager ───
  alertmanager:
    image: prom/alertmanager:latest
    container_name: balloo-alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - balloo-net
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  balloo-net:
    driver: bridge
