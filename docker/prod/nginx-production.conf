# Balloo Messenger — Production Nginx Configuration
# Фронтальный прокси: SSL termination + reverse proxy + WebSocket

# ─── Worker settings ───
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ─── MIME types ───
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ───
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ─── Performance ───
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # ─── Gzip ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ─── Security headers ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ─── Rate limiting zones ───
    # Общий: 100 запросов/сек с IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    # Auth: 5 запросов/мин с IP (brute-force защита)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    # API: 30 запросов/сек с IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # WebSocket: 20 новых подключений/мин с IP
    limit_req_zone $binary_remote_addr zone=ws:10m rate=20r/m;
    # Upload: 2 запроса/мин с IP
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/m;

    # ─── Timeouts ───
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    large_client_header_buffers 4 16k;
    client_max_body_size 100M;

    # ─── Upstreams ───
    upstream web_backend {
        server web:80;
    }

    upstream server_backend {
        server server:3000;
    }

    # ─── HTTP server — redirect to HTTPS ───
    server {
        listen 80;
        listen [::]:80;
        server_name balloo.su app.balloo.su api.balloo.su
                    staging.balloo.su admin.balloo.su
                    docs.balloo.su download.balloo.su
                    features.balloo.su history.balloo.su
                    command.balloo.su blog.balloo.su;

        # ACME challenge для Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Все остальные запросы — редирект на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS server ───
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name balloo.su app.balloo.su api.balloo.su
                    staging.balloo.su admin.balloo.su
                    docs.balloo.su download.balloo.su
                    features.balloo.su history.balloo.su
                    command.balloo.su blog.balloo.su;

        # ─── SSL ───
        ssl_certificate /etc/nginx/ssl/balloo.su/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/balloo.su/privkey.pem;
        ssl_trusted_certificate /etc/nginx/ssl/balloo.su/chain.pem;

        # SSL optimization
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ─── Health check (пропускаем через HTTPS) ───
        location /health {
            proxy_pass http://server_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            access_log off;
        }

        # Readiness probe — полная проверка зависимостей
        location /health/ready {
            proxy_pass http://server_backend/health/ready;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            access_log off;
        }

        # ─── Static files (базовый landing, иконки) ───
        location /assets/ {
            proxy_pass http://web_backend/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ─── API endpoints ───
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://server_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Timeouts для API
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ─── OAuth callbacks ───
        location /api/auth/oauth/ {
            limit_req zone=auth burst=10 nodelay;
            
            proxy_pass http://server_backend/api/auth/oauth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ─── WebSocket ───
        location /ws/ {
            limit_req zone=ws burst=10 nodelay;
            
            proxy_pass http://server_backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # WebSocket timeout — очень большой (поддерживаем long-lived connection)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ─── File uploads ───
        location /api/upload/ {
            limit_req zone=upload burst=3 nodelay;
            
            proxy_pass http://server_backend/api/upload/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Upload timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            client_max_body_size 100M;
        }

        # ─── Payment webhooks (YooKassa) ───
        location /api/payments/webhook/ {
            proxy_pass http://server_backend/api/payments/webhook/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Webhooks — без rate limiting, без timeout
            client_max_body_size 10M;
        }

        # ─── Frontend SPA ───
        location / {
            proxy_pass http://web_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # SPA: try_files для history mode
            # Если static файлы не найдены — отдаём index.html
            # (это обрабатывается на уровне web_backend/nginx в контейнере)
        }

        # ─── Admin panel (отдельная настройка) ───
        location /admin/ {
            proxy_pass http://web_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ─── Docs ───
        location /docs/ {
            proxy_pass http://web_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ─── Downloads ───
        location /downloads/ {
            proxy_pass http://server_backend/downloads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Large file downloads
            proxy_buffering off;
            client_max_body_size 0;
        }

        # ─── 404 fallback ───
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
