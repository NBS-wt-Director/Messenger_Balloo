server {
    listen 80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ============================================================
    # Security headers — тикет №65 (Security audit)
    # OWASP Top 10: Security Misconfiguration prevention
    # ============================================================

    # HSTS — HTTPS Strict Transport Security
    # Принуждает браузеры использовать HTTPS на 2 года, включая поддомены
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # X-Content-Type-Options: предотвращает MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # X-Frame-Options: защита от clickjacking (запрет iframe)
    add_header X-Frame-Options "DENY" always;

    # X-XSS-Protection: защита от XSS в старых браузерах
    add_header X-XSS-Protection "1; mode=block" always;

    # Content-Security-Policy: предотвращает XSS и injection атаки
    # default-src 'self' — только свой домен по умолчанию
    # script-src — скрипты только с своего домена + inline (для React/Vite)
    # style-src — стили только с своего домена + inline
    # img-src — изображения с своего домена, data URI и HTTPS
    # connect-src — API и WebSocket только с своего домена и API
    # font-src — шрифты с своего домена и data URI
    # object-src 'none' — запрещает <object>, <embed>, <applet>
    # media-src — медиа с своего домена и HTTPS (для историй)
    # frame-src 'none' — запрещает iframe
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.balloo.su wss://api.balloo.su; font-src 'self' data:; media-src 'self' https:; object-src 'none'; frame-src 'none';" always;

    # Referrer-Policy: контролирует отправку Referer header
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy: отключение чувствительных API браузера
    # camera, microphone, geolocation отключены — мессенджер не использует их в веб-версии
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Web static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://server:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket reverse proxy
    location /ws/ {
        proxy_pass http://server:3000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check
    location /health {
        access_log off;
        proxy_pass http://server:3000/health;
    }
}
